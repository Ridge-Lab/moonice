name: MoonIce checks
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: js wasm wasm-gc native
          - os: windows-latest
            targets: js native
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.20+65efd5b93"
          core-version: "0.10.20+65efd5b93"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r tools/requirements-reference.txt
      - run: moon update
      - run: python scripts/verify.py --profile full --targets ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: work/verification/
      - uses: actions/upload-pages-artifact@v3
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: web/
  public-package:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.20+65efd5b93"
          core-version: "0.10.20+65efd5b93"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registry-only consumer after package publication
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify.py --profile release --version "${RELEASE_TAG#v}" --targets js wasm wasm-gc native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-consumer
          path: work/verification/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
