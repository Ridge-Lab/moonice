name: MoonIce checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.8+8606a5800"
          core-version: "0.10.8+8606a5800"
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }} --release
      - name: Exercise CLI entry point
        if: matrix.target == 'js' || matrix.target == 'native'
        run: moon run --target ${{ matrix.target }} cmd/main -- scan fixtures/deletes.icebundle.json --limit 1
      - name: Exercise public library integration
        run: moon run --target ${{ matrix.target }} examples/library_read
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.8+8606a5800"
          core-version: "0.10.8+8606a5800"
      - run: moon update
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: moonice-web
          path: web/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
